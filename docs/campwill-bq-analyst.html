<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CAMPWILL BQ アナリスト</title>
  <style>
    :root {
      --bg: #f7f8fa;
      --card: #fff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --primary: #0066ff;
      --primary-hover: #0052cc;
      --green: #16a34a;
      --red: #dc2626;
      --amber: #d97706;
      --code-bg: #0b1021;
      --code-fg: #e5e7eb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    .container { max-width: 1100px; margin: 0 auto; padding: 24px 16px; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    h1 { font-size: 20px; margin: 0; }
    .subtitle { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .settings-btn {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 14px;
      cursor: pointer;
      font-size: 13px;
    }
    .settings-btn:hover { background: #f3f4f6; }
    .quick-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .quick-btn {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.15s;
    }
    .quick-btn:hover {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .input-area {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 16px;
      box-shadow: 0 1px 2px rgba(0,0,0,.04);
    }
    .input-area textarea {
      width: 100%;
      border: none;
      outline: none;
      resize: vertical;
      min-height: 56px;
      font-family: inherit;
      font-size: 14px;
      background: transparent;
    }
    .input-area .actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
    }
    .send-btn {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 18px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }
    .send-btn:disabled { background: #93a5b8; cursor: not-allowed; }
    .send-btn:hover:not(:disabled) { background: var(--primary-hover); }
    .hint { font-size: 11px; color: var(--muted); }

    .chat-history { display: flex; flex-direction: column; gap: 16px; }
    .message {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
    }
    .msg-q { background: #eff6ff; border-color: #bfdbfe; }
    .msg-q .label { color: #1d4ed8; }
    .label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-bottom: 6px; }

    .sql-block {
      background: var(--code-bg);
      color: var(--code-fg);
      border-radius: 8px;
      padding: 12px;
      margin-top: 8px;
      font-family: "SF Mono", Menlo, Consolas, monospace;
      font-size: 12px;
      overflow-x: auto;
      white-space: pre;
    }
    details.sql-detail summary {
      cursor: pointer;
      color: var(--muted);
      font-size: 12px;
      padding: 4px 0;
    }

    .result-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 12px;
    }
    .result-table th, .result-table td {
      border: 1px solid var(--border);
      padding: 6px 8px;
      text-align: left;
      max-width: 280px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .result-table th { background: #f9fafb; font-weight: 600; }
    .result-meta { font-size: 11px; color: var(--muted); margin-top: 6px; }

    .insight { margin-top: 12px; white-space: pre-wrap; font-size: 14px; }
    .insight strong { color: var(--green); }

    .error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: var(--red);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
    }

    .loading {
      color: var(--muted);
      font-size: 13px;
      font-style: italic;
    }

    /* Settings modal */
    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal-bg.show { display: flex; }
    .modal {
      background: var(--card);
      border-radius: 12px;
      padding: 24px;
      width: 92%;
      max-width: 500px;
    }
    .modal h2 { margin: 0 0 12px; font-size: 16px; }
    .modal label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-top: 12px; }
    .modal input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 13px;
      margin-top: 4px;
      font-family: monospace;
    }
    .modal .info {
      background: #f0f9ff;
      border: 1px solid #bae6fd;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 11px;
      color: #075985;
      margin-top: 8px;
    }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
    .btn-secondary {
      background: #f3f4f6;
      border: none;
      border-radius: 6px;
      padding: 8px 16px;
      cursor: pointer;
      font-size: 13px;
    }
    .btn-primary {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 8px 16px;
      cursor: pointer;
      font-size: 13px;
    }

    @media (max-width: 640px) {
      .quick-btn { flex: 1 0 calc(50% - 4px); }
      .container { padding: 16px 12px; }
    }
  </style>
</head>
<body>
<div class="container">
  <header>
    <div>
      <h1>📊 CAMPWILL BQ アナリスト</h1>
      <div class="subtitle">BigQuery mart 横断分析 (PII ゼロ / SELECT only)</div>
    </div>
    <button class="settings-btn" id="settings-btn">⚙ 設定</button>
  </header>

  <div class="quick-actions">
    <button class="quick-btn" data-q="直近 30 日のチャネル別 ROAS と CPA を比較し、要改善媒体を指摘して">📢 広告分析</button>
    <button class="quick-btn" data-q="直近 4 週のチャネル別 revenue と ROAS を週次で比較して">📈 チャネル ROI</button>
    <button class="quick-btn" data-q="直近 30 日の SKU 別粗利と実質粗利率を粗利額順に出して">💰 粗利分析</button>
    <button class="quick-btn" data-q="直近のキャンペーン別 click_rate / purchase_rate_pct / klaviyo_revenue を出して">📧 Klaviyo 分析</button>
    <button class="quick-btn" data-q="直近 30 日の施策と効果検証結果 (change_pct, effect) を出して、効果順に並べて">🧪 施策追跡</button>
    <button class="quick-btn" data-q="不動産: campwill-realestate.mart.re_seo_article_initiative_results から、直近の SEO 記事別効果を確認。change_pct が高い順 上位 5 件と低い順 5 件を表示。記事タイトル / article_url / baseline_clicks / observed_clicks / observed_days / change_pct / effect を含めて。insufficient_data は除外">🏠 不動産個別記事 SEO 効果</button>
  </div>

  <div class="input-area">
    <textarea id="question" placeholder="質問を入力 (例: 直近7日のチャネル別ROAS)"></textarea>
    <div class="actions">
      <span class="hint">Cloud Run プロキシ経由で BQ mart を問い合わせ。初回は 5-8 秒かかります。</span>
      <button class="send-btn" id="send-btn">▶ 送信</button>
    </div>
  </div>

  <div class="chat-history" id="chat-history"></div>
</div>

<!-- Settings modal -->
<div class="modal-bg" id="modal-bg">
  <div class="modal">
    <h2>⚙ 接続設定</h2>
    <div class="info">Anthropic API キーは Cloud Run プロキシ側で保持しているため、ここでは不要です。</div>
    <label>Cloud Run URL</label>
    <input id="cfg-url" placeholder="https://bq-analyst-proxy-xxx-an.a.run.app">
    <label>X-API-Key (社内配布)</label>
    <input id="cfg-key" type="password" placeholder="共有秘密 (Secret Manager 由来)">
    <div class="modal-actions">
      <button class="btn-secondary" id="cfg-cancel">キャンセル</button>
      <button class="btn-primary" id="cfg-save">保存</button>
    </div>
  </div>
</div>

<script>
const LS = {
  url: "bq_analyst_url",
  key: "bq_analyst_key",
};

function loadConfig() {
  return {
    url: localStorage.getItem(LS.url) || "",
    key: localStorage.getItem(LS.key) || "",
  };
}
function saveConfig(url, key) {
  localStorage.setItem(LS.url, url.trim());
  localStorage.setItem(LS.key, key.trim());
}
function requireConfig() {
  const c = loadConfig();
  if (!c.url || !c.key) {
    openSettings();
    throw new Error("Cloud Run URL と X-API-Key を設定してください (右上の ⚙ 設定)");
  }
  return c;
}

const $hist = document.getElementById("chat-history");
const $q = document.getElementById("question");
const $send = document.getElementById("send-btn");
const $modal = document.getElementById("modal-bg");

function openSettings() {
  const c = loadConfig();
  document.getElementById("cfg-url").value = c.url;
  document.getElementById("cfg-key").value = c.key;
  $modal.classList.add("show");
}
function closeSettings() { $modal.classList.remove("show"); }

document.getElementById("settings-btn").onclick = openSettings;
document.getElementById("cfg-cancel").onclick = closeSettings;
document.getElementById("cfg-save").onclick = () => {
  const url = document.getElementById("cfg-url").value;
  const key = document.getElementById("cfg-key").value;
  saveConfig(url, key);
  closeSettings();
};

document.querySelectorAll(".quick-btn").forEach(btn => {
  btn.onclick = () => { $q.value = btn.dataset.q; ask(); };
});
$send.onclick = () => ask();
$q.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") ask();
});

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;",
  }[c]));
}

function extractSql(text) {
  // ```sql ... ``` ブロックを取り出す
  const m = text.match(/```(?:sql)?\s*\n([\s\S]*?)```/i);
  return m ? m[1].trim() : null;
}

function renderTable(rows) {
  if (!rows || rows.length === 0) return '<div class="result-meta">(結果 0 行)</div>';
  const cols = Object.keys(rows[0]);
  const head = cols.map(c => `<th>${escapeHtml(c)}</th>`).join("");
  const body = rows.slice(0, 50).map(r =>
    "<tr>" + cols.map(c => `<td title="${escapeHtml(r[c])}">${escapeHtml(r[c])}</td>`).join("") + "</tr>"
  ).join("");
  const more = rows.length > 50 ? `<div class="result-meta">... 計 ${rows.length} 行 (上位 50 行のみ表示)</div>` : `<div class="result-meta">計 ${rows.length} 行</div>`;
  return `<table class="result-table"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>${more}`;
}

function appendMessage(html) {
  const div = document.createElement("div");
  div.innerHTML = html;
  $hist.appendChild(div);
  div.scrollIntoView({ behavior: "smooth", block: "start" });
  return div;
}

async function callApi(path, body, cfg) {
  const res = await fetch(cfg.url.replace(/\/$/, "") + path, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "X-API-Key": cfg.key,
    },
    body: JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const errMsg = data.error || res.statusText;
    const code = data.code || "";
    let humanErr = errMsg;
    if (code === "auth")          humanErr = "X-API-Key が間違っているか未設定です (⚙ 設定 から確認)";
    else if (code === "mart-only") humanErr = "mart テーブル以外は参照できません: " + errMsg;
    else if (code === "select-only" || code === "forbidden-keyword") humanErr = "SQL ガードで拒否されました: " + errMsg;
    throw new Error(humanErr);
  }
  return data;
}

async function ask() {
  const question = $q.value.trim();
  if (!question) return;

  let cfg;
  try { cfg = requireConfig(); }
  catch (e) {
    appendMessage(`<div class="message"><div class="error">${escapeHtml(e.message)}</div></div>`);
    return;
  }

  $send.disabled = true;
  $q.value = "";

  // Q
  appendMessage(`
    <div class="message msg-q">
      <div class="label">質問</div>
      <div>${escapeHtml(question)}</div>
    </div>`);

  // 1) SQL 生成
  const work = appendMessage(`<div class="message"><div class="loading">⏳ SQL を生成中...</div></div>`);
  let chatResp;
  try {
    chatResp = await callApi("/chat", { messages: [{ role: "user", content: question }] }, cfg);
  } catch (e) {
    work.innerHTML = `<div class="message"><div class="error">${escapeHtml(e.message)}</div></div>`;
    $send.disabled = false;
    return;
  }

  const sql = extractSql(chatResp.text);
  if (!sql) {
    work.innerHTML = `<div class="message">
      <div class="label">Claude 応答 (SQL 抽出失敗)</div>
      <div>${escapeHtml(chatResp.text)}</div>
    </div>`;
    $send.disabled = false;
    return;
  }

  // 2) 実行
  work.innerHTML = `
    <div class="message">
      <details class="sql-detail" open>
        <summary>📋 生成 SQL</summary>
        <div class="sql-block">${escapeHtml(sql)}</div>
      </details>
      <div class="loading">⏳ BigQuery 実行中...</div>
    </div>`;

  let queryResp;
  try {
    queryResp = await callApi("/query", { sql }, cfg);
  } catch (e) {
    work.innerHTML = `
      <div class="message">
        <details class="sql-detail" open>
          <summary>📋 生成 SQL</summary>
          <div class="sql-block">${escapeHtml(sql)}</div>
        </details>
        <div class="error">${escapeHtml(e.message)}</div>
      </div>`;
    $send.disabled = false;
    return;
  }

  // 3) 示唆生成
  work.innerHTML = `
    <div class="message">
      <details class="sql-detail">
        <summary>📋 生成 SQL (${queryResp.elapsed_ms} ms)</summary>
        <div class="sql-block">${escapeHtml(queryResp.sql_executed || sql)}</div>
      </details>
      <div class="label" style="margin-top:10px;">📊 結果</div>
      ${renderTable(queryResp.rows)}
      <div class="loading" style="margin-top:10px;">💡 示唆を生成中...</div>
    </div>`;

  // 上位 50 行に切り詰めて再度 Claude へ
  const trimmed = (queryResp.rows || []).slice(0, 50);
  const insightInput = [
    { role: "user", content: question },
    { role: "assistant", content: "```sql\n" + sql + "\n```" },
    {
      role: "user",
      content:
        "以下が実行結果です。上記の質問に対して 3-5 個の事業示唆を箇条書きで出し、必要なら次に試すべき分析を 1-2 個提案してください。\n\n" +
        "結果 (上位 " + trimmed.length + " 行):\n```json\n" + JSON.stringify(trimmed, null, 2).slice(0, 8000) + "\n```",
    },
  ];

  let insight;
  try {
    insight = await callApi("/chat", { messages: insightInput, max_tokens: 2048 }, cfg);
  } catch (e) {
    work.querySelector(".loading").outerHTML = `<div class="error">示唆生成エラー: ${escapeHtml(e.message)}</div>`;
    $send.disabled = false;
    return;
  }

  work.innerHTML = `
    <div class="message">
      <details class="sql-detail">
        <summary>📋 生成 SQL (${queryResp.elapsed_ms} ms)</summary>
        <div class="sql-block">${escapeHtml(queryResp.sql_executed || sql)}</div>
      </details>
      <div class="label" style="margin-top:10px;">📊 結果</div>
      ${renderTable(queryResp.rows)}
      <div class="label" style="margin-top:14px;">💡 示唆</div>
      <div class="insight">${escapeHtml(insight.text)}</div>
    </div>`;

  $send.disabled = false;
}

// 初回読み込み時、未設定なら設定モーダルを開く
window.addEventListener("DOMContentLoaded", () => {
  const c = loadConfig();
  if (!c.url || !c.key) openSettings();
});
</script>
</body>
</html>
